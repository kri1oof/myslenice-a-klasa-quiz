name: LNP history backfill

on:
  push:
    branches: [lnp-history-backfill-all]
    paths:
      - 'scripts/lnp_history_backfill.mjs'
      - '.github/workflows/lnp-history-backfill.yml'
      - '.github/workflows/lnp-history-build.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: lnp-history-backfill-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore verified ŁNP caches
        run: |
          mkdir -p /tmp/lnp-main /tmp/lnp-2024 /tmp/lnp-history-prev

          MAIN_RUN="$(gh run list --workflow 'LNP full sync' --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [ -n "$MAIN_RUN" ]; then
            echo "Current production cache: $MAIN_RUN"
            gh run download "$MAIN_RUN" -n lnp-myslenice-data -D /tmp/lnp-main || true
          fi

          HIST_RUN="$(gh run list --workflow 'LNP full sync' --branch lnp-history-2024-25 --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [ -n "$HIST_RUN" ]; then
            echo "Verified 2024/25 cache: $HIST_RUN"
            gh run download "$HIST_RUN" -n lnp-myslenice-data -D /tmp/lnp-2024 || true
          fi

          for RUN_ID in $(gh run list --workflow 'LNP history backfill' --branch "$GITHUB_REF_NAME" --limit 6 --json databaseId --jq '.[].databaseId'); do
            if [ "$RUN_ID" = "$GITHUB_RUN_ID" ]; then
              continue
            fi
            rm -rf /tmp/lnp-history-prev/*
            if gh run download "$RUN_ID" -n lnp-history-data -D /tmp/lnp-history-prev 2>/dev/null; then
              echo "Previous historical cache: $RUN_ID"
              break
            fi
          done

          node - <<'NODE'
          const fs = require('fs');
          const read = path => fs.existsSync(path) ? JSON.parse(fs.readFileSync(path, 'utf8')) : null;
          const current = read('/tmp/lnp-main/lnp_myslenice.json');
          const historical = read('/tmp/lnp-2024/lnp_myslenice.json');
          const previous = read('/tmp/lnp-history-prev/lnp_myslenice_history.json');
          const base = previous || current || historical || { seasons:{} };
          base.seasons = {
            ...(previous?.seasons || {}),
            ...(historical?.seasons || {}),
            ...(current?.seasons || {}),
          };
          if (historical?.seasons?.['2024/25']) base.seasons['2024/25'] = historical.seasons['2024/25'];
          fs.writeFileSync('lnp_history_cache.json', JSON.stringify(base, null, 2));
          console.log('CACHE_SEASONS', Object.keys(base.seasons || {}).sort());
          NODE

      - run: npm install playwright@1.55.0
      - run: npx playwright install --with-deps chromium

      - name: Discover and download every available Myślenice A-class season
        env:
          LNP_CACHE: lnp_history_cache.json
          LNP_OUT: lnp_myslenice_history.json
          LNP_CHUNK: '20'
          LNP_RETRIES: '4'
          LNP_RETRY_BASE_MS: '12000'
        run: node scripts/lnp_history_backfill.mjs

      - name: Validate and summarize historical snapshot
        id: validate
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('lnp_myslenice_history.json', 'utf8'));
          const seasons = data.seasons || {};
          const labels = Object.keys(seasons).sort();
          if (!labels.length) throw new Error('No seasons downloaded');
          for (const required of ['2024/25', '2025/26', '2026/27']) {
            if (!seasons[required]) throw new Error(`Missing verified season ${required}`);
          }

          const included = data.discovery?.included || [];
          const missing = data.discovery?.missingPlay || [];
          const ambiguous = data.discovery?.ambiguousPlay || [];
          const failedLookup = data.discovery?.failedPlayLookup || [];
          const rows = labels.map(label => {
            const season = seasons[label] || {};
            return {
              season:label,
              playName:season.playName || '',
              matches:(season.matches || []).length,
              events:Object.keys(season.events || {}).length,
              players:Object.keys(season.players || {}).length,
              mode:data.syncStats?.[label]?.mode || '',
            };
          });

          const report = {
            fetchedAt:data.fetchedAt,
            officialSeasonCount:(data.discovery?.officialSeasons || []).length,
            discoveredMyślenicePlayCount:included.length,
            downloadedSeasonCount:labels.length,
            seasons:rows,
            missingPlay:missing,
            ambiguousPlay:ambiguous,
            failedPlayLookup:failedLookup,
            warnings:data.warnings || [],
            errors:data.errors || [],
            totals:{
              matches:rows.reduce((sum,row)=>sum+row.matches,0),
              events:rows.reduce((sum,row)=>sum+row.events,0),
              players:rows.reduce((sum,row)=>sum+row.players,0),
            },
          };
          fs.writeFileSync('lnp_history_report.json', JSON.stringify(report, null, 2));
          const md = [
            '# ŁNP history backfill report',
            '',
            `Official seasons exposed by API: ${report.officialSeasonCount}`,
            `Myślenice A-class plays discovered: ${report.discoveredMyślenicePlayCount}`,
            `Seasons downloaded: ${report.downloadedSeasonCount}`,
            `Matches: ${report.totals.matches}; events: ${report.totals.events}; player profiles: ${report.totals.players}`,
            '',
            '| Season | Matches | Events | Players | Mode |',
            '|---|---:|---:|---:|---|',
            ...rows.map(r => `| ${r.season} | ${r.matches} | ${r.events} | ${r.players} | ${r.mode} |`),
            '',
            `Missing Myślenice group: ${JSON.stringify(missing)}`,
            `Ambiguous groups skipped: ${JSON.stringify(ambiguous)}`,
            `Failed play lookups: ${JSON.stringify(failedLookup)}`,
            `Warnings: ${(data.warnings || []).length}`,
            `Errors: ${(data.errors || []).length}`,
          ].join('\n');
          fs.writeFileSync('lnp_history_report.md', md);
          console.log(md);
          console.log('ERROR_SAMPLE', JSON.stringify((data.errors || []).slice(0,20)));
          console.log('WARNING_SAMPLE', JSON.stringify((data.warnings || []).slice(0,20)));
          NODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lnp-history-data
          path: |
            lnp_myslenice_history.json
            lnp_history_report.json
            lnp_history_report.md
          if-no-files-found: warn
          retention-days: 90

      - name: Install project
        if: success()
        run: |
          python -m pip install -U pip
          pip install -e '.[dev]'

      - name: Generate historical questions
        if: success()
        run: |
          cp lnp_myslenice_history.json lnp_myslenice_all.json
          python scripts/build_lnp_questions.py \
            --raw lnp_myslenice_all.json \
            --db lnp_history_build.db \
            --lnp-export lnp_history_questions.json \
            --player-export web/data/player-characters.json \
            --existing web/data/questions.json \
            --output web/data/questions.json | tee lnp_history_build_summary.txt
          cp web/data/questions.json docs/data/questions.json
          cp web/data/player-characters.json docs/data/player-characters.json

      - name: Validate 2022/23 evidence-only questions
        if: success()
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          payload = json.loads(Path('lnp_history_questions.json').read_text(encoding='utf-8'))
          questions = payload.get('questions') or []
          season = [q for q in questions if q.get('season') == '2022/23']
          assert season, 'No questions generated for 2022/23'

          blocked = {
              'match_squad_absent',
              'unused_substitute',
              'player_not_in_club',
              'player_season_for_club',
              'player_season_minutes_over',
              'compare_player_minutes',
              'match_player_minutes',
              'match_compare_player_minutes',
          }
          bad = [q for q in season if q.get('type') in blocked]
          assert not bad, [(q.get('type'), q.get('question')) for q in bad[:10]]

          player_positive = [
              q for q in season
              if any(token in str(q.get('type') or '') for token in ('player', 'scorer', 'captain', 'substitution', 'starting_xi', 'came_off_bench', 'shirt_number', 'card'))
          ]
          assert player_positive, 'No positive player questions for 2022/23'

          types = Counter(q.get('type') for q in season)
          print('SEASON_2022_23_QUESTIONS', len(season))
          print('SEASON_2022_23_TYPES', json.dumps(dict(types), ensure_ascii=False, sort_keys=True))
          print('SEASON_2022_23_PLAYER_POSITIVE', len(player_positive))
          PY

      - name: Commit enriched historical database
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/data/questions.json docs/data/questions.json web/data/player-characters.json docs/data/player-characters.json
          if git diff --cached --quiet; then
            echo 'No historical database changes to commit.'
          else
            git commit -m 'Add verified ŁNP historical seasons to quiz'
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
