name: Expand 2023-25 LNP questions

on:
  push:
    branches: [lnp-expand-2023-2025]
    paths:
      - '.github/workflows/lnp-expand-2023-2025.yml'
      - 'scripts/build_lnp_questions.py'
      - 'scripts/question_store.py'
      - 'tests/test_build_lnp_questions_shards.py'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: lnp-expand-2023-2025
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download verified historical LNP snapshot
        run: |
          mkdir -p /tmp/lnp-history
          RUN_ID="$(gh run list --workflow 'LNP history backfill' --branch lnp-history-backfill-all --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          test -n "$RUN_ID"
          echo "Using historical backfill run: $RUN_ID"
          gh run download "$RUN_ID" -n lnp-history-data -D /tmp/lnp-history
          cp /tmp/lnp-history/lnp_myslenice_history.json lnp_myslenice_history.json

      - name: Validate historical source coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('lnp_myslenice_history.json').read_text(encoding='utf-8'))
          expected = {
              '2023/24': (210, 205, 499),
              '2024/25': (210, 207, 494),
          }
          for label, (matches_expected, events_expected, players_expected) in expected.items():
              season = data['seasons'][label]
              matches = len(season.get('matches') or [])
              events = len(season.get('events') or {})
              players = len(season.get('players') or {})
              print(label, 'matches=', matches, 'events=', events, 'players=', players)
              assert matches == matches_expected, (label, matches)
              assert events == events_expected, (label, events)
              assert players == players_expected, (label, players)
          PY

      - name: Install project
        run: |
          python -m pip install -U pip
          pip install -e '.[dev]'

      - name: Generate 2023/24 questions
        run: |
          python scripts/build_lnp_questions.py \
            --raw lnp_myslenice_history.json \
            --db /tmp/lnp_2023_24.db \
            --lnp-export /tmp/lnp_2023_24_questions.json \
            --player-export /tmp/lnp_2023_24_players.json \
            --existing web/data/questions \
            --output web/data/questions \
            --only-season "2023/24" | tee /tmp/lnp_2023_24_summary.txt

      - name: Generate 2024/25 questions
        run: |
          python scripts/build_lnp_questions.py \
            --raw lnp_myslenice_history.json \
            --db /tmp/lnp_2024_25.db \
            --lnp-export /tmp/lnp_2024_25_questions.json \
            --player-export /tmp/lnp_2024_25_players.json \
            --existing web/data/questions \
            --output web/data/questions \
            --only-season "2024/25" | tee /tmp/lnp_2024_25_summary.txt

      - name: Sync docs copy
        run: |
          rm -rf docs/data/questions
          cp -R web/data/questions docs/data/questions

      - name: Validate evidence-only expansion
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          import sys

          sys.path.insert(0, str(Path('scripts').resolve()))
          from question_store import load_question_store

          blocked = {
              'match_squad_absent',
              'unused_substitute',
              'player_not_in_club',
              'player_season_for_club',
              'player_season_minutes_over',
              'compare_player_minutes',
              'match_player_minutes',
              'match_compare_player_minutes',
              'lnp_player_age',
          }
          direct_tokens = (
              'player', 'scorer', 'captain', 'substitution',
              'starting_xi', 'came_off_bench', 'shirt_number', 'card'
          )

          for label, path in (
              ('2023/24', '/tmp/lnp_2023_24_questions.json'),
              ('2024/25', '/tmp/lnp_2024_25_questions.json'),
          ):
              payload = json.loads(Path(path).read_text(encoding='utf-8'))
              questions = [q for q in payload.get('questions') or [] if q.get('season') == label]
              assert questions, label
              bad = [q for q in questions if q.get('type') in blocked]
              assert not bad, [(q.get('type'), q.get('question')) for q in bad[:10]]
              types = Counter(q.get('type') for q in questions)
              assert types['match_score'] == 210, (label, types['match_score'])
              assert types['match_winner'] == 210, (label, types['match_winner'])
              positive = [
                  q for q in questions
                  if any(token in str(q.get('type') or '') for token in direct_tokens)
              ]
              assert positive, label
              print(label, 'generated=', len(questions), 'positive_player=', len(positive))
              print(label, 'types=', json.dumps(dict(types), ensure_ascii=False, sort_keys=True))

          merged = load_question_store('web/data/questions')
          counts = Counter(q.get('season') for q in merged['questions'])
          print('MERGED_COUNT', merged['count'])
          print('MERGED_SEASONS', json.dumps(dict(counts), ensure_ascii=False, sort_keys=True))
          assert merged['count'] == len(merged['questions'])
          assert counts['2023/24'] > 10000, counts['2023/24']
          assert counts['2024/25'] > 10000, counts['2024/25']
          assert counts['2022/23'] >= 21818, counts['2022/23']
          assert counts['2025/26'] >= 25114, counts['2025/26']
          assert counts['2026/27'] >= 7507, counts['2026/27']

          for root in (Path('web/data/questions'), Path('docs/data/questions')):
              largest = max(p.stat().st_size for p in root.glob('*.json'))
              print(root, 'largest_bytes=', largest)
              assert largest < 45 * 1024 * 1024
          PY

      - name: Run tests
        run: pytest -q

      - name: Commit expanded question database
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A web/data/questions docs/data/questions
          if git diff --cached --quiet; then
            echo 'No question database changes to commit.'
          else
            git commit -m 'Expand 2023-25 LNP question database'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
