name: LNP 2026-27 sync
on:
  push:
    branches: [lnp-data-2025-2027]
    paths:
      - '.github/workflows/lnp-sync-2026.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sync-current:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Prepare current-season-only scraper
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/lnp_sync.mjs')
          s = p.read_text(encoding='utf-8')
          start = s.index('const SEASONS = [')
          end = s.index('];', start) + 2
          replacement = "const SEASONS = [\n  { label: '2026/27', id: '3c77d143-8010-4073-9842-d6b63365ffce' },\n];"
          s = s[:start] + replacement + s[end:]
          Path('scripts/lnp_sync_2026_runtime.mjs').write_text(s, encoding='utf-8')
          PY
      - name: Fetch official ŁNP 2026/27 data
        env:
          LNP_OUT: lnp_2026_27.json
          LNP_CHUNK: '24'
        run: node scripts/lnp_sync_2026_runtime.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lnp-2026-27-data
          path: lnp_2026_27.json
          if-no-files-found: warn
