name: LNP build questions
on:
  push:
    branches: [main, lnp-data-2025-2027, game-player-characters]
    paths:
      - '.github/workflows/lnp-build.yml'
      - 'scripts/build_lnp_questions.py'
      - 'scripts/question_store.py'
      - 'src/myslenice_quiz/export.py'
      - 'src/myslenice_quiz/ingest/laczynaspilka.py'
      - 'src/myslenice_quiz/player_characters.py'
      - 'src/myslenice_quiz/questions/**'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore production question base on feature branches
        if: github.ref_name != 'main'
        run: |
          git fetch origin main
          rm -rf web/data/questions docs/data/questions
          git checkout origin/main -- web/data/questions docs/data/questions
      - name: Download latest successful production ŁNP snapshot
        run: |
          mkdir -p /tmp/lnp
          RUN_ID="$(gh run list --workflow 'LNP full sync' --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$RUN_ID"
          echo "Using main-branch LNP full sync run: $RUN_ID"
          gh run download "$RUN_ID" -n lnp-myslenice-data -D /tmp/lnp
          cp /tmp/lnp/lnp_myslenice.json lnp_myslenice_2025_26_2026_27.json
      - name: Normalize snapshot
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('lnp_myslenice_2025_26_2026_27.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          required = {'2025/26', '2026/27'}
          available = set(data.get('seasons') or {})
          missing = required - available
          assert not missing, f'Missing seasons: {sorted(missing)}'
          extra = available - required
          if extra:
              print('Ignoring non-production seasons in gameplay build:', sorted(extra))
          data['seasons'] = {
              label: season
              for label, season in (data.get('seasons') or {}).items()
              if label in required
          }

          future_ids = set()
          for season in (data.get('seasons') or {}).values():
              for match in season.get('matches') or []:
                  if (match.get('state') or '').casefold() == 'nierozegrany':
                      future_ids.add(match.get('matchId'))
                      match['state'] = 'Zaplanowany'

          errors = []
          for raw in data.get('errors') or []:
              text = str(raw)
              if extra and any(label in text for label in extra):
                  continue
              if 'events status 204' in text and any(mid and mid in text for mid in future_ids):
                  continue
              errors.append(raw)
          data['errors'] = errors
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding='utf-8')

          print('RAW_ERRORS_AFTER_NORMALIZATION', len(errors))
          for label, season in data['seasons'].items():
              matches = season.get('matches') or []
              events = season.get('events') or {}
              profiles = season.get('players') or {}
              states = {}
              for match in matches:
                  states[match.get('state')] = states.get(match.get('state'), 0) + 1
              print(label, 'matches=', len(matches), 'events=', len(events), 'profiles=', len(profiles), 'states=', states)
          assert set(data['seasons']) == required, sorted(data['seasons'])
          assert not errors, errors[:10]
          PY
      - name: Install project
        run: |
          python -m pip install -U pip
          pip install -e '.[dev]'
      - name: Generate and merge quiz questions
        run: |
          START_TS=$(date +%s)
          python scripts/build_lnp_questions.py \
            --raw lnp_myslenice_2025_26_2026_27.json \
            --db lnp_build.db \
            --lnp-export lnp_questions.json \
            --player-export web/data/player-characters.json \
            --existing web/data/questions \
            --output web/data/questions | tee lnp_build_summary.txt
          END_TS=$(date +%s)
          echo "BUILD_SECONDS $((END_TS - START_TS))" | tee -a lnp_build_summary.txt
          rm -rf docs/data/questions
          cp -R web/data/questions docs/data/questions
          cp web/data/player-characters.json docs/data/player-characters.json
      - name: Validate generated database
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          import sys

          sys.path.insert(0, str(Path('scripts').resolve()))
          from question_store import load_question_store

          merged = load_question_store('web/data/questions')
          lnp = json.loads(Path('lnp_questions.json').read_text(encoding='utf-8'))
          characters = json.loads(Path('web/data/player-characters.json').read_text(encoding='utf-8'))
          players = characters.get('players') or []
          assert merged['count'] == len(merged['questions'])
          assert lnp['count'] == len(lnp['questions'])
          assert characters['count'] == len(players)
          assert merged['count'] >= 26540, merged['count']
          assert characters['count'] >= 100, characters['count']
          assert any('laczynaspilka.pl' in src for q in lnp['questions'] for src in (q.get('sources') or []))
          assert any(p.get('sample_reliable') for p in players), 'No reliable player samples'
          assert any(int((p.get('stats') or {}).get('goals') or 0) > 0 for p in players), 'No goals in player profiles'
          assert 'nie są oficjalnymi' in characters.get('rating_note', '')
          required_ratings = {'experience', 'rhythm', 'finishing', 'discipline', 'game_rating'}
          for player in players:
              ratings = player.get('ratings') or {}
              assert required_ratings <= set(ratings), (player.get('player'), ratings)
              assert all(35 <= int(ratings[key]) <= 95 for key in required_ratings), (player.get('player'), ratings)

          seasons = Counter(q.get('season') for q in lnp['questions'])
          assert seasons['2025/26'] > 0, seasons
          assert seasons['2026/27'] > 0, seasons
          character_seasons = Counter(p.get('season') for p in players)
          assert set(character_seasons) == {'2025/26', '2026/27'}, character_seasons

          types = Counter(q.get('type') for q in lnp['questions'])
          required_types = {
              'player_season_minutes_over',
              'compare_player_minutes',
              'match_compare_player_minutes',
              'match_squad_absent',
          }
          missing_types = required_types - set(types)
          assert not missing_types, f'Missing new question types: {sorted(missing_types)}'

          printable_seasons = {str(key): value for key, value in seasons.items()}
          printable_character_seasons = {str(key): value for key, value in character_seasons.items()}
          print('MERGED_COUNT', merged['count'])
          print('LNP_COUNT', lnp['count'])
          print('LNP_PLAYER_CHARACTERS', characters['count'])
          print('LNP_SEASONS', json.dumps(printable_seasons, ensure_ascii=False, sort_keys=True))
          print('PLAYER_CHARACTER_SEASONS', json.dumps(printable_character_seasons, ensure_ascii=False, sort_keys=True))
          print('LNP_TYPES', json.dumps(dict(types), ensure_ascii=False, sort_keys=True))
          with Path('lnp_build_summary.txt').open('a', encoding='utf-8') as f:
              print('MERGED_COUNT', merged['count'], file=f)
              print('LNP_COUNT', lnp['count'], file=f)
              print('LNP_PLAYER_CHARACTERS', characters['count'], file=f)
              print('LNP_SEASONS', json.dumps(printable_seasons, ensure_ascii=False, sort_keys=True), file=f)
              print('PLAYER_CHARACTER_SEASONS', json.dumps(printable_character_seasons, ensure_ascii=False, sort_keys=True), file=f)
              print('LNP_TYPES', json.dumps(dict(types), ensure_ascii=False, sort_keys=True), file=f)
          PY
      - name: Commit enriched question database
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A web/data/questions docs/data/questions web/data/player-characters.json docs/data/player-characters.json
          if git diff --cached --quiet; then
            echo 'No generated quiz data changes to commit.'
          else
            git commit -m 'Expand quiz with ŁNP player characters'
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
      - name: Deploy updated quiz on Pages
        if: success() && github.ref_name == 'main'
        run: gh workflow run pages.yml --ref "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lnp-built-quiz-data
          path: |
            lnp_myslenice_2025_26_2026_27.json
            lnp_questions.json
            web/data/player-characters.json
            lnp_build_summary.txt
          if-no-files-found: warn
