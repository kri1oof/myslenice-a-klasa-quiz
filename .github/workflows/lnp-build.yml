name: LNP build questions
on:
  push:
    branches: [main, lnp-data-2025-2027]
    paths:
      - '.github/workflows/lnp-build.yml'
      - 'scripts/build_lnp_questions.py'
      - 'src/myslenice_quiz/export.py'
      - 'src/myslenice_quiz/ingest/laczynaspilka.py'
      - 'src/myslenice_quiz/questions/**'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download latest successful full ŁNP snapshot
        run: |
          mkdir -p /tmp/lnp
          RUN_ID="$(gh run list --workflow 'LNP full sync' --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$RUN_ID"
          echo "Using LNP full sync run: $RUN_ID"
          gh run download "$RUN_ID" -n lnp-myslenice-data -D /tmp/lnp
          cp /tmp/lnp/lnp_myslenice.json lnp_myslenice_2025_26_2026_27.json
      - name: Normalize snapshot
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('lnp_myslenice_2025_26_2026_27.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          required = {'2025/26', '2026/27'}
          missing = required - set(data.get('seasons') or {})
          assert not missing, f'Missing seasons: {sorted(missing)}'

          future_ids = set()
          for season in (data.get('seasons') or {}).values():
              for match in season.get('matches') or []:
                  if (match.get('state') or '').casefold() == 'nierozegrany':
                      future_ids.add(match.get('matchId'))
                      match['state'] = 'Zaplanowany'

          errors = []
          for raw in data.get('errors') or []:
              text = str(raw)
              if 'events status 204' in text and any(mid and mid in text for mid in future_ids):
                  continue
              errors.append(raw)
          data['errors'] = errors
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding='utf-8')

          print('RAW_ERRORS_AFTER_NORMALIZATION', len(errors))
          for label, season in data['seasons'].items():
              matches = season.get('matches') or []
              events = season.get('events') or {}
              profiles = season.get('players') or {}
              states = {}
              for match in matches:
                  states[match.get('state')] = states.get(match.get('state'), 0) + 1
              print(label, 'matches=', len(matches), 'events=', len(events), 'profiles=', len(profiles), 'states=', states)
          assert not errors, errors[:10]
          PY
      - name: Install project
        run: |
          python -m pip install -U pip
          pip install -e '.[dev]'
      - name: Generate and merge quiz questions
        run: |
          START_TS=$(date +%s)
          python scripts/build_lnp_questions.py \
            --raw lnp_myslenice_2025_26_2026_27.json \
            --db lnp_build.db \
            --lnp-export lnp_questions.json \
            --existing web/data/questions.json \
            --output web/data/questions.json | tee lnp_build_summary.txt
          END_TS=$(date +%s)
          echo "BUILD_SECONDS $((END_TS - START_TS))" | tee -a lnp_build_summary.txt
          cp web/data/questions.json docs/data/questions.json
      - name: Validate generated database
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          merged = json.loads(Path('web/data/questions.json').read_text(encoding='utf-8'))
          lnp = json.loads(Path('lnp_questions.json').read_text(encoding='utf-8'))
          assert merged['count'] == len(merged['questions'])
          assert lnp['count'] == len(lnp['questions'])
          assert merged['count'] >= 26540, merged['count']
          assert any('laczynaspilka.pl' in src for q in lnp['questions'] for src in (q.get('sources') or []))

          seasons = Counter(q.get('season') for q in lnp['questions'])
          assert seasons['2025/26'] > 0, seasons
          assert seasons['2026/27'] > 0, seasons

          types = Counter(q.get('type') for q in lnp['questions'])
          required_types = {
              'player_season_minutes_over',
              'compare_player_minutes',
              'match_compare_player_minutes',
              'match_squad_absent',
          }
          missing_types = required_types - set(types)
          assert not missing_types, f'Missing new question types: {sorted(missing_types)}'

          printable_seasons = {str(key): value for key, value in seasons.items()}
          print('MERGED_COUNT', merged['count'])
          print('LNP_COUNT', lnp['count'])
          print('LNP_SEASONS', json.dumps(printable_seasons, ensure_ascii=False, sort_keys=True))
          print('LNP_TYPES', json.dumps(dict(types), ensure_ascii=False, sort_keys=True))
          with Path('lnp_build_summary.txt').open('a', encoding='utf-8') as f:
              print('MERGED_COUNT', merged['count'], file=f)
              print('LNP_COUNT', lnp['count'], file=f)
              print('LNP_SEASONS', json.dumps(printable_seasons, ensure_ascii=False, sort_keys=True), file=f)
              print('LNP_TYPES', json.dumps(dict(types), ensure_ascii=False, sort_keys=True), file=f)
          PY
      - name: Commit enriched question database
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/data/questions.json docs/data/questions.json
          if git diff --cached --quiet; then
            echo 'No question database changes to commit.'
          else
            git commit -m 'Expand quiz with ŁNP player decision questions'
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
      - name: Deploy updated quiz on Pages
        if: success() && github.ref_name == 'main'
        run: gh workflow run pages.yml --ref "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lnp-built-quiz-data
          path: |
            lnp_myslenice_2025_26_2026_27.json
            lnp_questions.json
            lnp_build_summary.txt
          if-no-files-found: warn
