name: LNP history build

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download latest historical snapshot from this branch
        run: |
          mkdir -p /tmp/lnp-history
          RUN_ID="$(gh run list --workflow 'LNP history backfill' --branch "$GITHUB_REF_NAME" --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          test -n "$RUN_ID"
          echo "Using history backfill run: $RUN_ID"
          if ! gh run download "$RUN_ID" -n lnp-history-data -D /tmp/lnp-history; then
            rm -rf /tmp/lnp-history/*
            RUN_ID="$(gh run list --workflow 'LNP history backfill' --branch "$GITHUB_REF_NAME" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            test -n "$RUN_ID"
            echo "Falling back to successful history run: $RUN_ID"
            gh run download "$RUN_ID" -n lnp-history-data -D /tmp/lnp-history
          fi
          cp /tmp/lnp-history/lnp_myslenice_history.json lnp_myslenice_all.json

      - name: Normalize historical snapshot
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('lnp_myslenice_all.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          seasons = data.get('seasons') or {}
          assert seasons, 'No historical seasons in snapshot'
          assert '2024/25' in seasons, sorted(seasons)
          assert '2025/26' in seasons, sorted(seasons)
          assert '2026/27' in seasons, sorted(seasons)

          for season in seasons.values():
              for match in season.get('matches') or []:
                  if (match.get('state') or '').casefold() == 'nierozegrany':
                      match['state'] = 'Zaplanowany'

          path.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding='utf-8')
          print('SEASONS_FOR_BUILD', sorted(seasons))
          print('RAW_WARNINGS', len(data.get('warnings') or []))
          print('RAW_ERRORS', len(data.get('errors') or []))
          PY

      - name: Install project
        run: |
          python -m pip install -U pip
          pip install -e '.[dev]'

      - name: Generate and merge historical questions
        run: |
          START_TS=$(date +%s)
          python scripts/build_lnp_questions.py \
            --raw lnp_myslenice_all.json \
            --db lnp_history_build.db \
            --lnp-export lnp_history_questions.json \
            --player-export web/data/player-characters.json \
            --existing web/data/questions \
            --output web/data/questions | tee lnp_history_build_summary.txt
          END_TS=$(date +%s)
          echo "BUILD_SECONDS $((END_TS - START_TS))" | tee -a lnp_history_build_summary.txt
          rm -rf docs/data/questions
          cp -R web/data/questions docs/data/questions
          cp web/data/player-characters.json docs/data/player-characters.json

      - name: Validate historical question database
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          import sys

          sys.path.insert(0, str(Path('scripts').resolve()))
          from question_store import load_question_store

          raw = json.loads(Path('lnp_myslenice_all.json').read_text(encoding='utf-8'))
          merged = load_question_store('web/data/questions')
          lnp = json.loads(Path('lnp_history_questions.json').read_text(encoding='utf-8'))
          chars = json.loads(Path('web/data/player-characters.json').read_text(encoding='utf-8'))

          assert merged['count'] == len(merged['questions'])
          assert lnp['count'] == len(lnp['questions'])
          assert chars['count'] == len(chars.get('players') or [])
          assert any('laczynaspilka.pl' in src for q in lnp['questions'] for src in (q.get('sources') or []))

          qseasons = Counter(q.get('season') for q in lnp['questions'])
          data_seasons = set(raw.get('seasons') or {})
          missing_question_seasons = sorted(label for label in data_seasons if not qseasons.get(label))
          if missing_question_seasons:
              print('SEASONS_WITHOUT_GENERATED_QUESTIONS', missing_question_seasons)

          for label in ('2024/25', '2025/26', '2026/27'):
              assert qseasons[label] > 0, (label, qseasons)

          report = {
              'merged_count': merged['count'],
              'lnp_count': lnp['count'],
              'player_characters': chars['count'],
              'question_seasons': dict(sorted(qseasons.items())),
              'data_seasons': sorted(data_seasons),
              'seasons_without_questions': missing_question_seasons,
          }
          Path('lnp_history_build_report.json').write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
          print('HISTORY_BUILD_REPORT', json.dumps(report, ensure_ascii=False))
          PY

      - name: Commit enriched historical database
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A web/data/questions docs/data/questions web/data/player-characters.json docs/data/player-characters.json
          if git diff --cached --quiet; then
            echo 'No historical database changes to commit.'
          else
            git commit -m 'Expand quiz with ŁNP historical seasons'
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lnp-history-built-quiz-data
          path: |
            lnp_myslenice_all.json
            lnp_history_questions.json
            lnp_history_build_summary.txt
            lnp_history_build_report.json
          if-no-files-found: warn
          retention-days: 90
