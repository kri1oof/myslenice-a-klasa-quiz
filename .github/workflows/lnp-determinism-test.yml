name: LNP determinism verification
on:
  push:
    branches: [fix-lnp-age-determinism]
    paths:
      - '.github/workflows/lnp-determinism-test.yml'
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download latest official ŁNP snapshot
        run: |
          mkdir -p /tmp/lnp
          RUN_ID="$(gh run list --workflow 'LNP full sync' --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$RUN_ID"
          gh run download "$RUN_ID" -n lnp-myslenice-data -D /tmp/lnp
          cp /tmp/lnp/lnp_myslenice.json /tmp/raw1.json
      - name: Create same-day timestamp variant
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timedelta
          from pathlib import Path
          data = json.loads(Path('/tmp/raw1.json').read_text(encoding='utf-8'))
          dt = datetime.fromisoformat(data['fetchedAt'].replace('Z', '+00:00')) + timedelta(minutes=7)
          data['fetchedAt'] = dt.isoformat(timespec='milliseconds').replace('+00:00', 'Z')
          Path('/tmp/raw2.json').write_text(json.dumps(data, ensure_ascii=False), encoding='utf-8')
          print('RAW1_FETCHED_AT', json.loads(Path('/tmp/raw1.json').read_text(encoding='utf-8'))['fetchedAt'])
          print('RAW2_FETCHED_AT', data['fetchedAt'])
          PY
      - name: Install project
        run: pip install -e .
      - name: Build twice and compare exactly
        run: |
          python scripts/build_lnp_questions.py --raw /tmp/raw1.json --db /tmp/a.db --lnp-export /tmp/lnp1.json --existing web/data/questions.json --output /tmp/merged1.json
          python scripts/build_lnp_questions.py --raw /tmp/raw2.json --db /tmp/b.db --lnp-export /tmp/lnp2.json --existing web/data/questions.json --output /tmp/merged2.json
          cmp /tmp/lnp1.json /tmp/lnp2.json
          cmp /tmp/merged1.json /tmp/merged2.json
          sha256sum /tmp/lnp1.json /tmp/lnp2.json /tmp/merged1.json /tmp/merged2.json
          echo 'DETERMINISM_OK'
