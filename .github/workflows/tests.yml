name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -U pip
      - run: pip install -e '.[dev]'
      - name: Functional tests
        run: pytest -q
      - name: Frontend JavaScript syntax
        run: |
          node --check web/question-sanity-core.js
          node --check web/fact-card-core.js
          node --check web/adaptive-difficulty-core.js
          node --check web/smart-question-engine-core.js
          node --check web/app.js
          node --check web/quality.js
          node --check web/rounds.js
          node --check web/match-mode.js
          node --check web/match-rpg.js
          node --check web/match-arcade.js
          node --check web/local-football-flavour.js
          node --check web/local-football-chaos.js
          node --check web/local-media-events.js
          node --check web/local-club-events.js
          node --check web/player-decision-questions.js
          node --check web/match-scenarios-core.js
          node --check web/match-scenarios.js
          node --check web/match-continuity-core.js
          node --check web/match-continuity.js
          node --check web/tactical-decisions-core.js
          node --check web/tactical-decisions.js
          node --check web/player-characters-core.js
          node --check web/player-characters.js
          node --check web/substitutions-core.js
          node --check web/substitutions.js
          node --check web/player-form-morale-core.js
          node --check web/player-form-morale.js
          node --check web/a-class-events-core.js
          node --check web/a-class-events.js
          node --check web/rivalry-matches-core.js
          node --check web/rivalry-matches.js
          node --check web/season-career-core.js
          node --check web/season-career.js
          node --check web/transfer-investigations-core.js
          node --check web/transfer-investigations.js
          node --check web/powerups-core.js
          node --check web/powerups.js
          node --check web/president-mode-career-bridge.js
          node --check web/president-mode-core.js
          node --check web/president-mode.js
          node --check web/president-mode-lifecycle.js
          node --check web/front-controller.js
          node --check web/arcade-front.js
          node --check web/achievements-core.js
          node --check web/achievements.js
          node --check web/match-commentator-core.js
          node --check web/match-commentator.js
          node --check web/readability.js
          node --check web/ux-polish.js
          node --check web/a-class-lifelines.js
          node --check web/rpg-setup-ux.js
          node --check web/rpg-clarity.js
          node --check web/dev-tools.js
      - name: Smart question engine smoke test
        run: node tests/smart-question-engine-smoke.mjs
      - name: Adaptive difficulty smoke test
        run: node tests/adaptive-difficulty-smoke.mjs
      - name: Fact card feedback smoke test
        run: node tests/fact-card-feedback-smoke.mjs
      - name: Match situations smoke test
        run: node tests/match-scenarios-smoke.mjs
      - name: Match continuity smoke test
        run: node tests/match-continuity-smoke.mjs
      - name: Tactical decisions smoke test
        run: node tests/tactical-decisions-smoke.mjs
      - name: Player characters smoke test
        run: node tests/player-characters-smoke.mjs
      - name: Substitutions smoke test
        run: node tests/substitutions-smoke.mjs
      - name: Player form and morale smoke test
        run: node tests/player-form-morale-smoke.mjs
      - name: Contextual A-class events smoke test
        run: node tests/a-class-events-smoke.mjs
      - name: Rivalry matches smoke test
        run: node tests/rivalry-matches-smoke.mjs
      - name: Season career smoke test
        run: node tests/season-career-smoke.mjs
      - name: Transfer investigations smoke test
        run: node tests/transfer-investigations-smoke.mjs
      - name: Power-up cards smoke test
        run: node tests/powerups-smoke.mjs
      - name: President mode smoke test
        run: node tests/president-mode-smoke.mjs
      - name: Achievements smoke test
        run: node tests/achievements-smoke.mjs
      - name: Match commentator and readability smoke test
        run: node tests/match-commentator-smoke.mjs
      - name: Focused UX smoke test
        run: node tests/ux-polish-smoke.mjs
      - name: A-class lifelines and squad-range smoke test
        run: node tests/a-class-lifelines-squad-smoke.mjs
      - name: RPG setup UX smoke test
        run: node tests/rpg-setup-ux-smoke.mjs
      - name: RPG clarity and contrast smoke test
        run: node tests/rpg-clarity-smoke.mjs
      - name: ŁNP incremental sync smoke test
        run: |
          node --check scripts/lnp_sync_helpers.mjs
          node --check scripts/lnp_sync.mjs
          node tests/lnp-sync-incremental-smoke.mjs
      - name: Developer controls smoke test
        run: node tests/dev-tools-smoke.mjs
      - name: Media events smoke test
        run: node tests/media-events-smoke.mjs
      - name: A-class life events smoke test
        run: node tests/local-club-events-smoke.mjs
      - name: Lint (advisory)
        run: ruff check src tests
        continue-on-error: true
