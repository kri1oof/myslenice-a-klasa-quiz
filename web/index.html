<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quiz A-klasy Myślenice</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div>
        <p class="eyebrow">MYŚLENICKA A-KLASA</p>
        <h1>Quiz dla kibiców</h1>
        <p class="lead">Wyniki, zawodnicy, strzelcy, tabele, historia ligi i klubowe smaczki.</p>
      </div>
      <div class="score-card" aria-live="polite">
        <span>Wynik</span>
        <strong id="score">0 / 0</strong>
      </div>
    </header>

    <section class="toolbar">
      <label>Zakres quizu
        <select id="scope-mode">
          <option value="league">Cała A-klasa Myślenice</option>
          <option value="club">Kibic konkretnej drużyny</option>
        </select>
      </label>
      <label id="club-label" class="hidden">Drużyna
        <select id="club"></select>
      </label>
      <label>Trudność
        <select id="difficulty">
          <option value="all">Wszystkie</option>
          <option value="1">1 — łatwa</option>
          <option value="2">2</option>
          <option value="3">3 — średnia</option>
          <option value="4">4</option>
          <option value="5">5 — trudna</option>
        </select>
      </label>
      <label>Typ
        <select id="type"><option value="all">Wszystkie</option></select>
      </label>
      <label>Liczba pytań
        <select id="question-count">
          <option value="10" selected>10</option>
          <option value="20">20</option>
          <option value="30">30</option>
          <option value="50">50</option>
          <option value="all">Wszystkie dostępne</option>
        </select>
      </label>
      <label class="humor-toggle"><span>Tryb stadionowy</span><span class="check-row"><input id="humor" type="checkbox" checked /> humorystyczne komentarze</span></label>
      <button id="new-game">Nowa gra</button>
    </section>

    <section id="status" class="status">Ładowanie bazy pytań…</section>

    <section id="quiz" class="quiz hidden">
      <div id="question-clubs" class="question-clubs" aria-label="Kluby związane z pytaniem"></div>
      <div class="meta">
        <span id="question-number"></span>
        <span id="season"></span>
        <span id="difficulty-label"></span>
      </div>
      <h2 id="question"></h2>
      <div id="answers" class="answers"></div>
      <div id="feedback" class="feedback hidden"></div>
      <div class="actions">
        <button id="sources" class="ghost hidden">Pokaż źródła</button>
        <button id="next" class="hidden">Następne pytanie</button>
      </div>
      <div id="source-box" class="source-box hidden"></div>
    </section>

    <section id="result" class="result hidden" aria-live="polite">
      <p class="eyebrow">KONIEC GRY</p>
      <h2>Twój wynik</h2>
      <div class="result-grid">
        <div><span>Wynik</span><strong id="result-score">0 / 0</strong></div>
        <div><span>Skuteczność</span><strong id="result-percent">0%</strong></div>
      </div>
      <p id="result-details" class="result-details"></p>
      <p id="result-humor" class="result-humor"></p>
      <button id="play-again">Zagraj jeszcze raz</button>
    </section>
  </main>

  <script src="app.js"></script>
  <script src="quality.js"></script>
</body>
</html>
